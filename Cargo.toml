[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
photo-cruiser-core = { path = "crates/core" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jpeg-encoder = "0.7.1"
webp = { version = "0.3.1", default-features = false }
sha2 = "0.10"
trash = "5.2"
clap = { version = "4.5", features = ["derive"] }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "x11", "wayland", "canvas", "image-without-codecs"] }
iced_test = "0.14"
# Only for `image::allocate` (iced re-exports it only with its `image` feature, which pulls all codecs).
iced_runtime = "0.14"
rfd = "0.17"
ron = "0.12"
assert_cmd = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Pixel loops (downscaling, rendering) are generic `image` code compiled into core, so
# they'd run unoptimized in dev builds otherwise.
[profile.dev.package.photo-cruiser-core]
opt-level = 2

[profile.release]
strip = true
